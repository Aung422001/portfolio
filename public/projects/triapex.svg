    <rect x="610" y="212" width="196" height="186" rx="14" fill="#ffffff" stroke="#e2efee" stroke-width="1.5"/>
    <rect x="626" y="228" width="164" height="112" rx="10" fill="#eef8f7"/>
    <circle cx="708" cy="284" r="30" fill="#5ecfcb" opacity="0.45"/>
