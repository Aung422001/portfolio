    <rect x="190" y="300" width="120" height="9" rx="4.5"/>
    <rect x="190" y="324" width="136" height="9" rx="4.5"/>
  </g>
  <rect x="190" y="366" width="76" height="12" rx="6" fill="#16293c" opacity="0.45"/>
  <g>
    <rect x="190" y="400" width="18" height="18" rx="5" fill="#86e0dd"/>
    <rect x="216" y="405" width="104" height="9" rx="4.5" fill="#c9e3e0"/>
    <rect x="190" y="432" width="18" height="18" rx="5" fill="#ffffff" stroke="#c9e3e0" stroke-width="2"/>
    <rect x="216" y="437" width="88" height="9" rx="4.5" fill="#dcecea"/>
    <rect x="190" y="464" width="18" height="18" rx="5" fill="#ffffff" stroke="#c9e3e0" stroke-width="2"/>
    <rect x="216" y="469" width="118" height="9" rx="4.5" fill="#dcecea"/>
