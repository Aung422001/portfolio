    <rect x="626" y="372" width="54" height="9" rx="4.5" fill="#c9e3e0"/>

    <rect x="826" y="212" width="196" height="186" rx="14" fill="#ffffff" stroke="#e2efee" stroke-width="1.5"/>
    <rect x="842" y="228" width="164" height="112" rx="10" fill="#eef8f7"/>
    <rect x="884" y="252" width="80" height="64" rx="10" fill="#16293c" opacity="0.14"/>
    <rect x="842" y="352" width="96" height="10" rx="5" fill="#16293c" opacity="0.55"/>
    <rect x="842" y="372" width="66" height="9" rx="4.5" fill="#c9e3e0"/>

    <!-- row 2 -->
    <rect x="394" y="418" width="196" height="186" rx="14" fill="#ffffff" stroke="#e2efee" stroke-width="1.5"/>
    <rect x="410" y="434" width="164" height="112" rx="10" fill="#eef8f7"/>
    <rect x="452" y="466" width="80" height="48" rx="24" fill="#86e0dd" opacity="0.4"/>
    <rect x="410" y="558" width="118" height="10" rx="5" fill="#16293c" opacity="0.55"/>
    <rect x="410" y="578" width="58" height="9" rx="4.5" fill="#c9e3e0"/>

    <rect x="610" y="418" width="196" height="186" rx="14" fill="#ffffff" stroke="#e2efee" stroke-width="1.5"/>
    <rect x="626" y="434" width="164" height="112" rx="10" fill="#eef8f7"/>
    <path d="M676 512l32-46 32 46z" fill="#5ecfcb" opacity="0.5"/>
    <rect x="626" y="558" width="104" height="10" rx="5" fill="#16293c" opacity="0.55"/>
    <rect x="626" y="578" width="62" height="9" rx="4.5" fill="#c9e3e0"/>

    <!-- highlighted card -->
    <rect x="826" y="418" width="196" height="186" rx="14" fill="#16293c"/>
    <rect x="842" y="434" width="164" height="112" rx="10" fill="#ffffff" opacity="0.07"/>
    <rect x="884" y="470" width="80" height="40" rx="8" fill="#86e0dd" opacity="0.85"/>
    <rect x="842" y="558" width="112" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
    <rect x="842" y="578" width="60" height="9" rx="4.5" fill="#86e0dd" opacity="0.7"/>
