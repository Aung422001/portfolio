<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Abstract e-commerce catalogue interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#16293c" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1010" cy="140" r="210" fill="#86e0dd" opacity="0.16"/>
  <circle cx="190" cy="640" r="150" fill="#86e0dd" opacity="0.10"/>

  <!-- app window -->
  <g filter="url(#soft)">
    <rect x="130" y="110" width="940" height="530" rx="22" fill="#ffffff" stroke="#e2efee" stroke-width="2"/>
  </g>

  <!-- top bar -->
  <path d="M130 132a22 22 0 0 1 22-22h896a22 22 0 0 1 22 22v44H130z" fill="#f7fdfc"/>
