  <circle cx="977" cy="155" r="2.6" fill="#86e0dd"/>
  <rect x="990" y="138" width="36" height="10" rx="5" fill="#86e0dd" opacity="0.55"/>

  <!-- filter sidebar -->
  <rect x="166" y="212" width="196" height="392" rx="14" fill="#f7fdfc" stroke="#e2efee" stroke-width="1.5"/>
  <rect x="190" y="240" width="92" height="12" rx="6" fill="#16293c" opacity="0.65"/>
  <g fill="#c9e3e0">
