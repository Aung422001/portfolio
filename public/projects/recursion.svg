<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Abstract language lesson card with answer options and a progress bar">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#16293c" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)"/>
  <circle cx="1030" cy="170" r="200" fill="#86e0dd" opacity="0.15"/>
  <circle cx="180" cy="610" r="150" fill="#86e0dd" opacity="0.10"/>

  <!-- stacked cards behind, suggesting many course pairs -->
  <rect x="236" y="138" width="728" height="470" rx="24" fill="#ffffff" opacity="0.55" stroke="#e2efee" stroke-width="2"/>
  <rect x="216" y="152" width="768" height="470" rx="24" fill="#ffffff" opacity="0.8" stroke="#e2efee" stroke-width="2"/>

  <g filter="url(#soft3)">
    <rect x="196" y="168" width="808" height="470" rx="24" fill="#ffffff" stroke="#e2efee" stroke-width="2"/>
  </g>

  <!-- progress -->
  <rect x="240" y="212" width="720" height="12" rx="6" fill="#eef8f7"/>
  <rect x="240" y="212" width="452" height="12" rx="6" fill="#86e0dd"/>
  <g fill="#c9e3e0">
    <circle cx="930" cy="218" r="5"/>
    <circle cx="948" cy="218" r="5"/>
  </g>

  <!-- prompt -->
  <rect x="240" y="266" width="188" height="12" rx="6" fill="#c9e3e0"/>

  <!-- the "word" being taught: abstract script strokes rather than real glyphs,
       so the cover renders identically on any machine -->
  <g stroke="#16293c" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M300 356c0-26 22-44 48-44s46 20 46 46-18 44-42 44c-18 0-30-10-30-24s10-22 24-22 22 10 22 22c0 20-14 34-34 40"/>
    <path d="M452 310v96"/>
    <path d="M452 356c14-30 40-46 62-46 20 0 30 14 30 34v62"/>
    <path d="M596 312c26 0 44 16 44 38 0 30-30 34-30 56h-2"/>
    <circle cx="609" cy="428" r="5.5" fill="#16293c" stroke="none"/>
  </g>

  <!-- romanisation -->
  <rect x="300" y="468" width="160" height="10" rx="5" fill="#c9e3e0"/>

  <!-- answer options -->
  <g>
    <rect x="240" y="516" width="348" height="70" rx="14" fill="#f7fdfc" stroke="#e2efee" stroke-width="2"/>
    <rect x="272" y="545" width="156" height="12" rx="6" fill="#16293c" opacity="0.45"/>

    <!-- selected / correct -->
    <rect x="612" y="516" width="348" height="70" rx="14" fill="#ffffff" stroke="#5ecfcb" stroke-width="2.5"/>
    <rect x="644" y="545" width="130" height="12" rx="6" fill="#16293c" opacity="0.7"/>
    <circle cx="912" cy="551" r="17" fill="#86e0dd"/>
    <path d="M904 551l6 6 12-13" stroke="#16293c" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- language chips, suggesting ten languages -->
  <g>
    <rect x="240" y="640" width="54" height="26" rx="13" fill="#16293c" opacity="0.85"/>
    <rect x="304" y="640" width="54" height="26" rx="13" fill="#c9e3e0"/>
    <rect x="368" y="640" width="54" height="26" rx="13" fill="#c9e3e0"/>
    <rect x="432" y="640" width="54" height="26" rx="13" fill="#dcecea"/>
    <rect x="496" y="640" width="54" height="26" rx="13" fill="#dcecea"/>
    <rect x="560" y="640" width="54" height="26" rx="13" fill="#e8f4f2"/>
    <rect x="624" y="640" width="54" height="26" rx="13" fill="#e8f4f2"/>
  </g>
</svg>
