<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Abstract candlestick chart with entry and exit markers and an equity curve">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="equity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ecfcb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5ecfcb" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#16293c" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg4)"/>
  <circle cx="1050" cy="150" r="190" fill="#86e0dd" opacity="0.14"/>
  <circle cx="160" cy="620" r="150" fill="#86e0dd" opacity="0.10"/>

  <g filter="url(#soft4)">
    <rect x="130" y="110" width="940" height="530" rx="22" fill="#ffffff" stroke="#e2efee" stroke-width="2"/>
  </g>

  <!-- header -->
  <rect x="166" y="150" width="128" height="13" rx="6.5" fill="#16293c" opacity="0.7"/>
  <g>
    <rect x="814" y="144" width="60" height="26" rx="13" fill="#eef8f7"/>
    <rect x="882" y="144" width="60" height="26" rx="13" fill="#16293c"/>
    <rect x="950" y="144" width="84" height="26" rx="13" fill="#eef8f7"/>
  </g>
  <line x1="166" y1="196" x2="1034" y2="196" stroke="#e2efee" stroke-width="2"/>

  <!-- grid -->
  <g stroke="#eef8f7" stroke-width="2">
    <line x1="166" y1="250" x2="1034" y2="250"/>
    <line x1="166" y1="318" x2="1034" y2="318"/>
    <line x1="166" y1="386" x2="1034" y2="386"/>
    <line x1="166" y1="454" x2="1034" y2="454"/>
  </g>

  <!-- candles: teal = up, muted coral = down -->
  <g stroke-width="3" stroke-linecap="round">
    <g stroke="#5ecfcb">
      <line x1="210" y1="392" x2="210" y2="452"/><rect x="200" y="404" width="20" height="36" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="266" y1="358" x2="266" y2="428"/><rect x="256" y="372" width="20" height="44" rx="4" fill="#5ecfcb" stroke="none"/>
    </g>
    <g stroke="#dd9b90">
      <line x1="322" y1="340" x2="322" y2="410"/><rect x="312" y="354" width="20" height="40" rx="4" fill="#dd9b90" stroke="none"/>
    </g>
    <g stroke="#5ecfcb">
      <line x1="378" y1="322" x2="378" y2="398"/><rect x="368" y="336" width="20" height="48" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="434" y1="290" x2="434" y2="366"/><rect x="424" y="302" width="20" height="50" rx="4" fill="#5ecfcb" stroke="none"/>
    </g>
    <g stroke="#dd9b90">
      <line x1="490" y1="278" x2="490" y2="348"/><rect x="480" y="292" width="20" height="42" rx="4" fill="#dd9b90" stroke="none"/>
      <line x1="546" y1="296" x2="546" y2="372"/><rect x="536" y="310" width="20" height="46" rx="4" fill="#dd9b90" stroke="none"/>
    </g>
    <g stroke="#5ecfcb">
      <line x1="602" y1="272" x2="602" y2="352"/><rect x="592" y="286" width="20" height="50" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="658" y1="244" x2="658" y2="318"/><rect x="648" y="256" width="20" height="48" rx="4" fill="#5ecfcb" stroke="none"/>
    </g>
    <g stroke="#dd9b90">
      <line x1="714" y1="238" x2="714" y2="308"/><rect x="704" y="250" width="20" height="44" rx="4" fill="#dd9b90" stroke="none"/>
    </g>
    <g stroke="#5ecfcb">
      <line x1="770" y1="222" x2="770" y2="296"/><rect x="760" y="234" width="20" height="48" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="826" y1="206" x2="826" y2="276"/><rect x="816" y="216" width="20" height="46" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="882" y1="228" x2="882" y2="292"/><rect x="872" y="238" width="20" height="42" rx="4" fill="#5ecfcb" stroke="none"/>
      <line x1="938" y1="212" x2="938" y2="284"/><rect x="928" y="222" width="20" height="50" rx="4" fill="#5ecfcb" stroke="none"/>
    </g>
  </g>

  <!-- entry / exit markers -->
  <g>
    <path d="M210 478l11 19h-22z" fill="#16293c"/>
    <path d="M826 190l-11-19h22z" fill="#16293c"/>
  </g>

  <!-- equity curve panel -->
  <rect x="166" y="500" width="868" height="104" rx="14" fill="#f7fdfc" stroke="#e2efee" stroke-width="1.5"/>
  <path d="M194 578 L286 566 L378 572 L470 548 L562 556 L654 530 L746 538 L838 512 L930 520 L1006 498 L1006 586 L194 586 Z" fill="url(#equity)"/>
  <path d="M194 578 L286 566 L378 572 L470 548 L562 556 L654 530 L746 538 L838 512 L930 520 L1006 498"
        fill="none" stroke="#5ecfcb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
